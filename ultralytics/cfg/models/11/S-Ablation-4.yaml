# yolo11-SC_DySample-S.yaml
# Ablation 4: C3k2_SC backbone + DySample upsampling (no ResEMA)
# Full model minus ResEMA — shows combined SC+DySample before adding attention
# Purpose: show incremental gain of adding ResEMA to SC+DySample combination

nc: 9
scales:
  s: [0.50, 0.50, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]                    # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                   # 1-P2/4
  - [-1, 2, C3k2_SC, [256, False, 0.25]]         # 2  ← SC
  - [-1, 1, Conv, [256, 3, 2]]                   # 3-P3/8
  - [-1, 2, C3k2_SC, [512, False, 0.25]]         # 4  ← SC
  - [-1, 1, Conv, [512, 3, 2]]                   # 5-P4/16
  - [-1, 2, C3k2_SC, [512, True]]                # 6  ← SC
  - [-1, 1, Conv, [1024, 3, 2]]                  # 7-P5/32
  - [-1, 2, C3k2_SC, [1024, True]]               # 8  ← SC
  - [-1, 1, SPPF, [1024, 5]]                     # 9
  - [-1, 2, C2PSA, [1024]]                       # 10

head:
  # Upsample P5 -> P4 (DySample, no ResEMA)
  - [-1, 1, DySample, [2, 'lp']]                 # 11  ← DySample
  - [[-1, 6], 1, Concat, [1]]                    # 12
  - [-1, 2, C3k2, [512, False]]                  # 13  P4 feature (no ResEMA)

  # Upsample P4 -> P3
  - [-1, 1, DySample, [2, 'lp']]                 # 14  ← DySample
  - [[-1, 4], 1, Concat, [1]]                    # 15
  - [-1, 2, C3k2, [256, False]]                  # 16  P3 → DETECT small

  # Downsample P3 -> P4
  - [-1, 1, Conv, [256, 3, 2]]                   # 17
  - [[-1, 13], 1, Concat, [1]]                   # 18  refs C3k2 at 13
  - [-1, 2, C3k2, [512, False]]                  # 19  P4 → DETECT medium

  # Downsample P4 -> P5
  - [-1, 1, Conv, [512, 3, 2]]                   # 20
  - [[-1, 10], 1, Concat, [1]]                   # 21
  - [-1, 2, C3k2, [1024, True]]                  # 22  P5 → DETECT large

  - [[16, 19, 22], 1, Detect, [nc]]              # 23