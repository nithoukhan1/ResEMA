# C3k2-SC e50 + DySample + ResEMA-V3
# YOLO11-S, 9 classes

nc: 9

scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]

  # shortcut=False, e=0.50, g=1, pooling_r=4
  - [-1, 2, C3k2_SC, [256, False, 0.50]]
  - [-1, 1, Conv, [256, 3, 2]]

  # shortcut=False, e=0.50, g=1, pooling_r=4
  - [-1, 2, C3k2_SC, [512, False, 0.50]]
  - [-1, 1, Conv, [512, 3, 2]]

  # shortcut=True, e=0.50
  - [-1, 2, C3k2_SC, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]

  # shortcut=True, e=0.50
  - [-1, 2, C3k2_SC, [1024, True]]

  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 2, C2PSA, [1024]]

head:
  # P5 -> P4
  - [-1, 1, DySample, [2, "lp", 4, False]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]
  - [-1, 1, ResEMA_V3, [32]]

  # P4 -> P3
  - [-1, 1, DySample, [2, "lp", 4, False]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]]
  - [-1, 1, ResEMA_V3, [32]]

  # P3 -> P4
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 14], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]
  - [-1, 1, ResEMA_V3, [32]]

  # P4 -> P5
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, ResEMA_V3, [32]]

  - [[18, 22, 26], 1, Detect, [nc]]