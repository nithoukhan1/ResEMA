name: Research Model Smoke

on:
  push:
    branches:
      - research-v7-publication
      - "diagnostic/**"
      - "feat/**"
      - "train/**"
    paths:
      - "ultralytics/nn/**"
      - "ultralytics/cfg/models/11/**"
      - "research/tests/test_model_smoke.py"
      - ".github/workflows/research-model-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install CPU research environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Build historical models and run CPU smoke test
        run: python -m pytest research/tests/test_model_smoke.py -q
