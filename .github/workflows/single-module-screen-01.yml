name: SMS-01 Single Module Screen Audit

on:
  push:
    branches:
      - research/single-module-screen-01
    paths:
      - ".gitattributes"
      - "research/05_experiments/SINGLE_MODULE_SCREEN_01_*"
      - "research/runtime/single_module_runner.py"
      - "research/tests/test_single_module_screen_01_*.py"
      - "research/tests/test_data01_active_bindings.py"
      - "research/tests/test_init01_initialization_lock.py"
      - "ultralytics/research/single_module_trainer.py"
      - "ultralytics/cfg/models/11/yolo11s-tpsc-*.yaml"
      - "ultralytics/cfg/models/11/yolo11s-dysample-v2.yaml"
      - "ultralytics/cfg/models/11/yolo11s-tpema-head-v1.yaml"
      - "ultralytics/nn/**"
      - ".github/workflows/single-module-screen-01.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sms01-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install project and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Verify repository state
        run: python research/tools/verify_repo_state.py

      - name: Run complete research suite
        run: >-
          python -m pytest
          -o addopts=''
          research/tests
          -q
