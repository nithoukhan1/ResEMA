name: VGRA DDP-B16 CPU Numerics

on:
  push:
    branches:
      - research/vgra-ddp-b16
    paths:
      - "research/r9_training/ddp_b16/**"
      - ".github/workflows/ddp-b16-cpu-numerics.yml"

permissions:
  contents: read

jobs:
  ddp-autograd:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pinned PyTorch CPU test runtime
        run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install NumPy for complete RNG-state recovery tests
        run: python -m pip install numpy==2.2.6
      - name: Run real two-rank Gloo autograd tests
        run: >-
          python research/r9_training/ddp_b16/torch_acceptance/ddp_autograd_cpu.py -v
      - name: Run two-rank G4 checkpoint recovery tests
        run: python research/r9_training/ddp_b16/torch_acceptance/ddp_g4_recovery_cpu.py -v
      - name: Run native two-rank FRESH/G4 resume cursor tests
        run: python research/r9_training/ddp_b16/torch_acceptance/ddp_native_state_cpu.py -v
      - name: Run two-rank rank0-only B-VAL synchronization tests
        run: python research/r9_training/ddp_b16/torch_acceptance/ddp_rank0_val_cpu.py -v
      - name: Run two-rank DDP admission consensus tests
        run: python research/r9_training/ddp_b16/torch_acceptance/ddp_rank_admission_cpu.py -v
      - name: Verify two-rank exact native constructor consensus
        run: python research/r9_training/ddp_b16/torch_acceptance/ddp_native_binding_cpu.py -v
      - name: Run import-only two-rank native source probe tests
        run: python research/r9_training/ddp_b16/torch_acceptance/ddp_native_import_cpu.py -v
      - name: Run native two-rank epoch-end G4 hook tests
        run: python research/r9_training/ddp_b16/torch_acceptance/ddp_native_g4_epoch_cpu.py -v
      - name: Run rank-0 selected BEST terminal boundary tests
        run: python research/r9_training/ddp_b16/torch_acceptance/ddp_terminal_cpu.py -v
