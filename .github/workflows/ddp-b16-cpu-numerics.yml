name: VGRA DDP-B16 CPU Numerics

on:
  push:
    branches:
      - research/vgra-ddp-b16
    paths:
      - "research/r9_training/ddp_b16/**"
      - ".github/workflows/ddp-b16-cpu-numerics.yml"

permissions:
  contents: read

jobs:
  ddp-autograd:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pinned PyTorch CPU test runtime
        run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Run real two-rank Gloo autograd tests
        run: >-
          python research/r9_training/ddp_b16/torch_acceptance/ddp_autograd_cpu.py -v
