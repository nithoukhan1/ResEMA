name: ARCH-CORR-01B Runtime Audit

on:
  push:
    branches:
      - research/arch-corr-01b
    paths:
      - "ultralytics/nn/**"
      - "ultralytics/cfg/models/11/yolo11s-tpsc-*.yaml"
      - "ultralytics/cfg/models/11/yolo11s-tpema-*.yaml"
      - "research/07_method/ARCH_CORR_01B_TPSC_PROTOCOL.md"
      - "research/07_method/ARCH_CORR_01C_EMA_PROTOCOL.md"
      - "research/tools/arch_corr_01b_transfer_audit.py"
      - "research/tools/arch_corr_01c_ema_audit.py"
      - "research/tests/test_arch_corr_01b_tpsc.py"
      - "research/tests/test_arch_corr_01c_ema.py"
      - ".github/workflows/arch-corr-01b-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install project and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Run focused TPSC unit tests
        run: >-
          python -m pytest
          -o addopts=''
          research/tests/test_arch_corr_01b_tpsc.py
          research/tests/test_arch_corr_01c_ema.py
          research/tests/test_arch_corr_01d_dysample.py
          -q

      - name: Fetch locked official YOLO11s checkpoint
        run: |
          curl -L --fail --retry 3             https://github.com/ultralytics/assets/releases/download/v8.4.0/yolo11s.pt             -o /tmp/yolo11s.pt
          echo "85a76fe86dd8afe384648546b56a7a78580c7cb7b404fc595f97969322d502d5  /tmp/yolo11s.pt"             | sha256sum --check -

      - name: Run full transfer and identity audit
        run: |
          python research/tools/arch_corr_01b_transfer_audit.py             --checkpoint /tmp/yolo11s.pt             --output /tmp/ARCH_CORR_01B_AUDIT.json

      - name: Run canonical EMA transfer and identity audit
        run: |
          python research/tools/arch_corr_01c_ema_audit.py \
            --checkpoint /tmp/yolo11s.pt \
            --output /tmp/ARCH_CORR_01C_EMA_AUDIT.json

      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: ARCH_CORR_01_AUDITS
          path: |
            /tmp/ARCH_CORR_01B_AUDIT.json
            /tmp/ARCH_CORR_01C_EMA_AUDIT.json
          if-no-files-found: error